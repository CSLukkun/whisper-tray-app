name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # macos-14 = Apple Silicon runner (arm64). For Intel artifact, add a
    # macos-13 matrix entry; unsigned .app / .dmg either way.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PortAudio
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller whisper_tray_macos.spec

      - name: Package .dmg
        id: dmg
        run: |
          chmod +x package_macos_dmg.sh
          ./package_macos_dmg.sh dist/WhisperTray.app
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            arm64|aarch64) ARCH_TAG="arm64" ;;
            x86_64|amd64)  ARCH_TAG="x86_64" ;;
            *)             ARCH_TAG="${ARCH}" ;;
          esac
          DMG="WhisperTray-${VERSION}-macos-${ARCH_TAG}.dmg"
          test -f "dist/${DMG}"
          echo "dmg_name=${DMG}" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${DMG}"

      - name: Upload artifact (.app + .dmg)
        uses: actions/upload-artifact@v4
        with:
          name: WhisperTray-macos
          path: |
            dist/WhisperTray.app
            dist/*.dmg
          if-no-files-found: error

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent WhisperTray.app ../WhisperTray-macos.zip
          cp "${{ steps.dmg.outputs.dmg_name }}" "../${{ steps.dmg.outputs.dmg_name }}"
          ls -lh ../WhisperTray-macos.zip "../${{ steps.dmg.outputs.dmg_name }}"

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WhisperTray-macos.zip
            ${{ steps.dmg.outputs.dmg_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
